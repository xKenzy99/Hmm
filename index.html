<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070a09">
<title>Birtaneme Özel</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Playfair+Display:wght@600;700;800&display=swap');

:root {
  --bg:#070a09;
  --bg2:#0b1110;
  --green:#55e39a;
  --green2:#20b86b;
  --text:#f2fff8;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg)}
body{
  color:var(--text);
  font-family:"Cormorant Garamond",Georgia,serif;
  background:
    radial-gradient(circle at 50% 48%, rgba(33,130,83,.16), transparent 28%),
    radial-gradient(circle at 20% 20%, rgba(74,208,137,.05), transparent 30%),
    linear-gradient(145deg,#050706 0%,#0a100e 50%,#050706 100%);
}
body:before{
  content:"";position:fixed;inset:-20%;
  background:
    radial-gradient(circle,rgba(94,240,164,.07) 0 1px,transparent 2px) 0 0/70px 70px;
  opacity:.35;animation:drift 22s linear infinite;pointer-events:none;
}
.scene{position:relative;width:100%;height:100%;display:grid;place-items:center}
.glow{position:absolute;width:min(72vw,720px);height:min(72vw,720px);border-radius:50%;
  background:rgba(52,221,132,.08);filter:blur(70px);opacity:.65;animation:breathe 5s ease-in-out infinite}
.content{position:relative;width:min(92vw,760px);height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:50px 20px}
.intro{position:absolute;z-index:20;text-align:center;animation:intro 2.4s cubic-bezier(.7,0,.2,1) forwards;pointer-events:none}
.intro .small{font-size:clamp(18px,4vw,30px);letter-spacing:.28em;text-transform:uppercase;opacity:.9}
.intro .big{margin-top:5px;font-family:"Playfair Display",Georgia,serif;font-size:clamp(42px,11vw,82px);font-weight:800;letter-spacing:.04em;color:#dffff0;text-shadow:0 0 35px rgba(75,230,143,.3)}
.card{position:relative;display:flex;flex-direction:column;align-items:center;opacity:0;transform:translateY(24px) scale(.96);animation:rise .9s 2.05s cubic-bezier(.2,.8,.2,1) forwards;width:100%}
.heart-wrap{position:relative;width:min(74vw,580px);height:min(74vw,580px);filter:drop-shadow(0 0 20px rgba(45,226,129,.16))}
.heart-wrap svg{width:100%;height:100%;display:block;overflow:visible}
.heart-outline{fill:none;stroke:url(#greenStroke);stroke-width:7;vector-effect:non-scaling-stroke}
.photo{filter:saturate(.95) contrast(1.02)}
.photo-shade{fill:url(#shade);opacity:.18}
.ring{fill:none;stroke:#53df99;stroke-width:2;opacity:.3;animation:pulse 3s ease-in-out infinite}
.title{position:absolute;top:calc(100% + 28px);text-align:center;line-height:.9;opacity:0;animation:titleTop 1s 2.8s cubic-bezier(.2,.8,.2,1) forwards}
.title h1{margin:0;font-family:"Playfair Display",Georgia,serif;font-size:clamp(31px,8vw,66px);font-weight:800;letter-spacing:.04em;text-shadow:0 0 22px rgba(58,220,132,.2)}
.title h2{margin:10px 0 0;font-size:clamp(22px,5vw,38px);font-weight:600;letter-spacing:.12em;color:#aaf5ca}
.hearts{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.fheart{position:absolute;bottom:-50px;font-size:var(--s);opacity:0;animation:float var(--d) var(--delay) ease-out infinite}
.fheart::after{content:"";position:absolute;inset:-12px;border-radius:50%;background:rgba(65,228,140,.08);filter:blur(8px);z-index:-1}
.corner{position:absolute;left:50%;transform:translateX(-50%);bottom:22px;font-size:13px;letter-spacing:.32em;text-transform:uppercase;color:rgba(207,255,229,.45);white-space:nowrap;opacity:0;animation:fadeIn 1s 4.1s forwards}
.spark{position:absolute;width:4px;height:4px;border-radius:50%;background:#8dffc0;box-shadow:0 0 12px #4ce393;opacity:0;animation:spark 3.5s linear infinite}
.s1{left:18%;top:28%;animation-delay:2.8s} .s2{right:19%;top:38%;animation-delay:3.4s}
.s3{left:26%;top:62%;animation-delay:3.9s} .s4{right:27%;top:67%;animation-delay:4.4s}
@keyframes intro{0%{opacity:0;transform:scale(.82)}12%{opacity:1}65%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.08)}}
@keyframes rise{to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes titleTop{0%{opacity:0;transform:translateY(20px)}100%{opacity:1;transform:translateY(0)}}
@keyframes float{0%{transform:translate3d(0,0,0) rotate(0) scale(.35);opacity:0}12%{opacity:.9}72%{opacity:.72}90%{opacity:0}100%{transform:translate3d(var(--x),-90vh,0) rotate(var(--r)) scale(1.05);opacity:0}}
@keyframes breathe{0%,100%{transform:scale(.9);opacity:.45}50%{transform:scale(1.08);opacity:.8}}
@keyframes pulse{0%,100%{opacity:.18;transform:scale(1)}50%{opacity:.55;transform:scale(1.025)}}
@keyframes drift{to{transform:translate3d(70px,70px,0)}}
@keyframes fadeIn{to{opacity:1}}
@keyframes spark{0%,100%{transform:scale(.3);opacity:0}35%{transform:scale(1.5);opacity:.8}65%{transform:scale(.6);opacity:.2}}
@media(max-height:650px){.heart-wrap{width:min(50vh,420px);height:min(50vh,420px)}.title{top:calc(100% + 10px)}.corner{display:none}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>
